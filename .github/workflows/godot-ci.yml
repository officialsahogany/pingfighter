name: Godot CI

on:
  pull_request:
    paths:
      - ".github/workflows/godot-ci.yml"
      - "AGENTS.md"
      - "docs/godot_port_checklist.md"
      - "godot/**"
      - "tools/**"
  push:
    paths:
      - ".github/workflows/godot-ci.yml"
      - "AGENTS.md"
      - "docs/godot_port_checklist.md"
      - "godot/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Godot release tag to install"
        required: true
        default: "4.6.2-stable"
      smoke_mode:
        description: "Smoke test coverage"
        required: true
        type: choice
        default: "focused"
        options:
          - focused
          - all
          - none

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.godot_version || '4.6.2-stable' }}
  SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_mode || 'focused' }}
  # Keep this list in lockstep with $focusedSmoke in
  # godot/tools/run_pre_push_checks.ps1 (the local pre-push gate). The two are
  # separate literal copies; if you add/remove a focused smoke, edit BOTH.
  FOCUSED_SMOKE_TESTS: >-
    res://tests/character_info_passive_ui_retire_smoke.gd
