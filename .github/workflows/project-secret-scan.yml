name: Project Secret Scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify scanner rejection and redaction
        shell: pwsh
        run: .\tools\verify_project_secret_scanner.ps1

      - name: Scan tracked project text
        shell: pwsh
        run: .\tools\verify_no_project_secrets.ps1 -TrackedOnly
