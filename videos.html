<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingFighter (핑파이터) - 영상 모음</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 40px;
            margin-top: 30px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 25px;
        }

        .video-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .video-description {
            color: #a0a0a0;
            line-height: 1.6;
        }

        .video-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
        }

        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PingFighter (핑파이터)</h1>
            <p class="subtitle">아케이드 스타일 탁구 보스전 게임</p>
        </header>

        <main>
            <div class="video-grid">
                <div class="video-card">
                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/hFKs3OPTY4E"
                            title="핑파이터 인트로 영상"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="video-info">
                        <h2 class="video-title">핑파이터 인트로 영상</h2>
                        <p class="video-description">
                            핑파이터의 오프닝 인트로 영상입니다.
                            게임의 세계관과 분위기를 소개합니다.
                        </p>
                        <a href="https://www.youtube.com/watch?v=hFKs3OPTY4E" target="_blank" class="video-link">
                            YouTube에서 보기
                        </a>
                    </div>
                </div>

                <div class="video-card">
                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/AP-C-EzlOX4"
                            title="핑파이터 스매셔 플레이영상"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="video-info">
                        <h2 class="video-title">핑파이터 스매셔 플레이영상</h2>
                        <p class="video-description">
                            스매셔 캐릭터의 실제 게임 플레이 영상입니다.
                            강력한 스매시 공격과 전투 스타일을 확인하세요.
                        </p>
                        <a href="https://www.youtube.com/watch?v=AP-C-EzlOX4" target="_blank" class="video-link">
                            YouTube에서 보기
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 PingFighter. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
